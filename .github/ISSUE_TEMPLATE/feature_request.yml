name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你在整理照片 / 生成照片墙时遇到的实际场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 项目边界确认
      options:
        - label: 该功能不需要网络请求、云服务或遥测（或已说明如何保持可选与离线）
          required: true
        - label: 该功能不会在用户的源媒体目录写入文件
          required: true
